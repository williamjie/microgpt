<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>One Training Step Demo</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap');
:root {
  --bg: #0f0f23; --bg2: #1a1a2e; --bg3: #161630;
  --green: #16c784; --red: #e94560; --yellow: #f0c040;
  --blue: #6c5ce7; --cyan: #00d2d3; --orange: #ff9f43; --pink: #fd79a8;
  --text: #eaeaea; --text-dim: #8888aa; --border: #2a2a4e;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font-family: 'IBM Plex Sans', sans-serif; min-height: 100vh; }
.container { max-width: 1100px; margin: 0 auto; padding: 32px 24px; }
.top-nav { margin-bottom: 16px; }
.top-nav a { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--cyan); text-decoration: none; }
.top-nav a:hover { color: var(--green); }
.header h1 {
  font-family: 'JetBrains Mono', monospace;
  font-size: 26px; font-weight: 700; color: var(--green); display: inline;
}
.header .tag {
  background: rgba(22,199,132,0.15); color: var(--green);
  font-size: 11px; font-family: 'JetBrains Mono', monospace;
  padding: 3px 10px; border-radius: 3px; margin-left: 12px; vertical-align: middle;
}
.subtitle {
  color: var(--text-dim); font-size: 14px; margin: 6px 0 24px;
  font-weight: 300; line-height: 1.6;
}
.controls { display: flex; gap: 8px; margin-bottom: 20px; align-items: center; flex-wrap: wrap; }
.ctrl-btn {
  background: var(--bg3); border: 1px solid var(--border); color: var(--text);
  font-family: 'JetBrains Mono', monospace; font-size: 13px;
  padding: 10px 20px; border-radius: 8px; cursor: pointer; transition: all 0.15s;
}
.ctrl-btn:hover { border-color: var(--green); background: rgba(22,199,132,0.1); }
.ctrl-btn.primary { background: rgba(22,199,132,0.15); border-color: var(--green); color: var(--green); }
.ctrl-btn.reset:hover { border-color: var(--red); color: var(--red); }
.ctrl-btn:disabled { opacity: 0.3; cursor: default; }
.phase-pill {
  font-family: 'JetBrains Mono', monospace; font-size: 12px;
  padding: 6px 14px; border-radius: 20px; margin-left: auto;
  background: var(--bg3); color: var(--text-dim); border: 1px solid var(--border);
}
.narration {
  background: var(--bg2); border: 1px solid var(--border); border-radius: 10px;
  padding: 16px 20px; margin-bottom: 20px; display: flex; gap: 14px; min-height: 64px;
}
.narration-icon { font-size: 18px; min-width: 24px; }
.narration-text { font-family: 'JetBrains Mono', monospace; font-size: 13px; line-height: 1.65; }
.hl-g { color: var(--green); font-weight: 600; }
.hl-y { color: var(--yellow); font-weight: 600; }
.hl-r { color: var(--red); font-weight: 600; }
.hl-b { color: var(--blue); font-weight: 600; }
.hl-c { color: var(--cyan); font-weight: 600; }
.hl-o { color: var(--orange); font-weight: 600; }
.pipeline {
  display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px;
}
.pipe {
  flex: 1; min-width: 100px; padding: 12px 10px; border-radius: 8px; text-align: center;
  background: var(--bg3); border: 1px solid var(--border);
  font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-dim);
  transition: all 0.25s;
}
.pipe.active {
  border-color: var(--green); color: var(--green);
  background: rgba(22,199,132,0.12); box-shadow: 0 0 16px rgba(22,199,132,0.15);
}
.pipe.done { border-color: var(--blue); color: var(--cyan); }
.pipe .n { display: block; font-size: 16px; font-weight: 700; margin-bottom: 4px; color: inherit; }
.panel {
  background: var(--bg2); border: 1px solid var(--border); border-radius: 10px;
  padding: 20px; margin-bottom: 16px; min-height: 160px;
}
.panel-label {
  font-family: 'JetBrains Mono', monospace; font-size: 10px;
  text-transform: uppercase; letter-spacing: 2px; color: var(--text-dim); margin-bottom: 14px;
}
.viz {
  font-family: 'JetBrains Mono', monospace; font-size: 14px; line-height: 1.8; color: var(--text);
  min-height: 80px;
}
.toks { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0; }
.tok {
  padding: 8px 10px; border-radius: 6px; background: var(--bg3); border: 1px solid var(--border);
  font-size: 13px;
}
.tok.bos { border-color: var(--yellow); color: var(--yellow); }
.tok.hi { border-color: var(--green); color: var(--green); }
.bars { display: flex; gap: 4px; align-items: flex-end; height: 60px; margin-top: 8px; }
.bars span {
  flex: 1; background: var(--blue); border-radius: 3px 3px 0 0; opacity: 0.7;
  transition: height 0.4s;
}
.param-row {
  display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px;
}
.knob {
  width: 48px; height: 48px; border-radius: 50%; border: 2px solid var(--border);
  background: var(--bg3); display: flex; align-items: center; justify-content: center;
  font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-dim);
  transition: transform 0.4s, border-color 0.3s;
}
.knob.spin { border-color: var(--orange); color: var(--orange); transform: rotate(40deg); }
.code-hint {
  margin-top: 12px; font-size: 12px; color: var(--text-dim);
}
.code-hint code { color: var(--yellow); font-family: 'JetBrains Mono', monospace; }
</style>
</head>
<body>
<div class="container">
  <div class="top-nav"><a href="demos_index.html">← 演示大厅</a></div>
  <div class="header">
    <h1>One Training Step</h1>
    <span class="tag">INTERACTIVE</span>
  </div>
  <p class="subtitle">
    把 microgpt 训练循环拆成可点击的阶段。示例文档：emma。对应 <strong style="color:var(--yellow)">microgpt.py</strong> 第 6 部分。
  </p>

  <div class="controls">
    <button class="ctrl-btn" id="btn-prev">← 上一步</button>
    <button class="ctrl-btn primary" id="btn-next">下一步 →</button>
    <button class="ctrl-btn" id="btn-auto">自动播放 ▶</button>
    <button class="ctrl-btn reset" id="btn-reset">重置</button>
    <div class="phase-pill" id="phase">步骤 0 / 8</div>
  </div>

  <div class="narration">
    <div class="narration-icon">💡</div>
    <div class="narration-text" id="narration"></div>
  </div>

  <div class="pipeline" id="pipeline"></div>

  <div class="panel">
    <div class="panel-label" id="viz-label">舞台</div>
    <div class="viz" id="viz"></div>
    <div class="code-hint" id="code-hint"></div>
  </div>
</div>

<script>
const STAGES = ['就绪', '取文档', '分词', '前向', '损失', '反向', 'Adam', '清零', '循环'];

const STEPS = [
  {
    active: 0,
    narr: '一步训练 = 拿一个名字，走完 <span class="hl-g">前向 → 损失 → 反向 → 更新</span>。点击下一步开始。',
    label: '就绪',
    html: '等待开始……<br><span style="color:var(--text-dim)">文档池里有约 32,000 个名字。</span>',
    code: ''
  },
  {
    active: 1,
    narr: '本步取出文档 <span class="hl-y">emma</span>。训练前会 <span class="hl-c">shuffle</span>，避免只背顺序。',
    label: '取文档',
    html: 'doc = <span style="color:var(--yellow);font-size:22px;font-weight:700">emma</span>',
    code: 'doc = docs[step % len(docs)]'
  },
  {
    active: 2,
    narr: '两侧加 <span class="hl-y">BOS</span>，变成模型真正看到的 token 序列。',
    label: '分词包裹',
    html: `<div class="toks">
      <div class="tok bos">BOS</div>
      <div class="tok hi">e</div>
      <div class="tok hi">m</div>
      <div class="tok hi">m</div>
      <div class="tok hi">a</div>
      <div class="tok bos">BOS</div>
    </div>
    <div style="color:var(--cyan)">[26, 4, 12, 12, 0, 26]</div>`,
    code: 'tokens = [BOS] + [uchars.index(ch) for ch in doc] + [BOS]'
  },
  {
    active: 3,
    narr: '逐位置调用 <span class="hl-g">gpt()</span>：预测下一个 token 的 logits，并写入 <span class="hl-b">KV Cache</span>。',
    label: '前向传播',
    html: `位置 0..n-1 依次：token → logits（27 维）→ softmax 概率<br>
    <div class="bars" id="logit-bars"></div>
    <div style="font-size:11px;color:var(--text-dim);margin-top:6px">示意：某位置上的 logits 高度</div>`,
    code: 'logits = gpt(token_id, pos_id, keys, values)'
  },
  {
    active: 4,
    narr: '每个位置：<span class="hl-g">loss_t = -log p(正确下一字)</span>，再对序列平均得到标量 loss。',
    label: '计算损失',
    html: `loss_t = -log p(target)<br>
    <span style="color:var(--orange);font-size:20px;font-weight:700">loss ≈ 2.85</span>
    <span style="color:var(--text-dim)">（示意，训练中会下降）</span>`,
    code: 'loss = (1/n) * sum(losses)'
  },
  {
    active: 5,
    narr: '一次 <span class="hl-r">loss.backward()</span>：从 loss 沿计算图回传，每个参数得到 <span class="hl-c">.grad</span>。',
    label: '反向传播',
    html: `计算图：loss ← softmax ← gpt ← 参数<br>
    <span style="color:var(--red)">∂L/∂param</span> 写入每个 Value.grad<br>
    <div style="margin-top:8px;color:var(--text-dim);font-size:12px">这就是 autograd_demo 里那套链式法则，放大到整网。</div>`,
    code: 'loss.backward()'
  },
  {
    active: 6,
    narr: '<span class="hl-o">Adam</span> 用梯度微调参数：维护动量 m 与波动 v，比裸 <code>p -= lr*grad</code> 更稳。',
    label: 'Adam 更新',
    html: `4192 个「旋钮」被轻轻拧动：
    <div class="param-row" id="knobs"></div>
    <div style="font-size:12px;color:var(--text-dim);margin-top:8px">p.data -= lr * m_hat / (√v_hat + eps)</div>`,
    code: 'Adam update on params'
  },
  {
    active: 7,
    narr: '必须 <span class="hl-y">p.grad = 0</span>。不清零，下一步梯度会脏累加。',
    label: '清零梯度',
    html: `所有参数：<span style="color:var(--yellow)">grad → 0</span><br>
    准备迎接下一个文档。`,
    code: 'p.grad = 0'
  },
  {
    active: 8,
    narr: '重复约 <span class="hl-g">1000</span> 步。然后冻结参数，进入推理：从 BOS 采样直到再采到 BOS——生成新名字。',
    label: '循环 / 推理',
    html: `step 1 → 2 → … → 1000<br>
    <span style="color:var(--green)">→ inference：kamon, karia, anna …</span>`,
    code: 'for step in range(num_steps): ...'
  }
];

let step = 0;
let autoTimer = null;

function buildPipeline() {
  const root = document.getElementById('pipeline');
  root.innerHTML = '';
  STAGES.forEach((name, i) => {
    const d = document.createElement('div');
    d.className = 'pipe';
    d.id = 'S' + i;
    d.innerHTML = `<span class="n">${i}</span>${name}`;
    root.appendChild(d);
  });
}

function render() {
  const s = STEPS[step];
  document.getElementById('narration').innerHTML = s.narr;
  document.getElementById('phase').textContent = `步骤 ${step} / ${STEPS.length - 1} · ${s.label}`;
  document.getElementById('viz-label').textContent = s.label;
  document.getElementById('viz').innerHTML = s.html;
  document.getElementById('code-hint').innerHTML = s.code
    ? `代码线索：<code>${s.code}</code>`
    : '';
  document.getElementById('btn-prev').disabled = step === 0;
  document.getElementById('btn-next').disabled = step === STEPS.length - 1;

  for (let i = 0; i < STAGES.length; i++) {
    const el = document.getElementById('S' + i);
    el.classList.remove('active', 'done');
    if (i === s.active) el.classList.add('active');
    else if (i < s.active) el.classList.add('done');
  }

  // Extra viz hooks after DOM insert
  if (step === 3) {
    const bars = document.getElementById('logit-bars');
    if (bars) {
      const heights = [30, 45, 70, 40, 25, 55, 35, 20];
      bars.innerHTML = heights.map(h => `<span style="height:${h}%"></span>`).join('');
    }
  }
  if (step === 6) {
    const knobs = document.getElementById('knobs');
    if (knobs) {
      knobs.innerHTML = '';
      for (let i = 0; i < 8; i++) {
        const k = document.createElement('div');
        k.className = 'knob';
        k.textContent = 'p' + i;
        knobs.appendChild(k);
        setTimeout(() => k.classList.add('spin'), 50 + i * 40);
      }
    }
  }
}

function stopAuto() {
  if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
  document.getElementById('btn-auto').textContent = '自动播放 ▶';
}

document.getElementById('btn-next').onclick = () => {
  stopAuto();
  if (step < STEPS.length - 1) { step++; render(); }
};
document.getElementById('btn-prev').onclick = () => {
  stopAuto();
  if (step > 0) { step--; render(); }
};
document.getElementById('btn-reset').onclick = () => { stopAuto(); step = 0; render(); };
document.getElementById('btn-auto').onclick = () => {
  if (autoTimer) { stopAuto(); return; }
  document.getElementById('btn-auto').textContent = '暂停 ⏸';
  autoTimer = setInterval(() => {
    if (step >= STEPS.length - 1) { stopAuto(); return; }
    step++;
    render();
  }, 2200);
};

buildPipeline();
render();
</script>
</body>
</html>
